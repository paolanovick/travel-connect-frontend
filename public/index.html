<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>Travel Connect</title>

    <!-- ✅ Favicon principal -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <!-- ✅ Icono para dispositivos Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- ✅ SEO básico -->
    <meta
      name="description"
      content="Travel Connect: Soluciones tecnológicas para agencias de viajes, modernizando tu operación y aumentando tu competitividad."
    />
    <meta name="author" content="Travel Connect" />
    <meta name="robots" content="index, follow" />

    <!-- ✅ Redes sociales / Open Graph -->
    <meta property="og:title" content="Travel Connect" />
    <meta
      property="og:description"
      content="Soluciones tecnológicas para agencias de viajes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo192.png" />
    <meta property="og:url" content="https://travelconnect.com.ar" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel Connect" />
    <meta
      name="twitter:description"
      content="Soluciones tecnológicas para agencias de viajes."
    />
    <meta name="twitter:image" content="/logo192.png" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
